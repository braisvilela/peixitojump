'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),W=600,H=900;let boss,shield,inv,nextBoss,altitude,bossCount;let enemies,shots,ink,cool,bonus,reason,spawnAt,fireHeld=false;let fish,plats,particles,camera,highest,score,mode='menu',best=0,keys=new Set(),touch=0,sound=true,audio,last=0,acc=0;try{best=+localStorage.peixitoJumpBest||0}catch{}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const setup=document.querySelector('#setup'),preview=document.querySelector('#preview'),pg=preview.getContext('2d'),color=document.querySelector('#color'),pattern=document.querySelector('#pattern'),inputMode=document.querySelector('#inputMode');const $=id=>document.getElementById(id);const hues=[32,190,165,265,320,48,105,210,350,135], namesSkin=['Laranja','Azul turquesa','Verde água','Roxo','Rosa','Dourado','Verde','Azul','Vermelho','Esmeralda'], patternsSkin=['Clássico','Listrado','Pintado','Bicolor','Multicolorido'];function choice(el,parent,value,name,swatch){el.add(new Option(name,value));let b=document.createElement('button');b.type='button';b.dataset.value=value;b.title=name;b.setAttribute('aria-label',name);if(swatch){b.className='swatch';b.style.setProperty('--swatch',`hsl(${value} 78% 55%)`)}else b.textContent=name;b.onclick=()=>{el.value=value;el.dispatchEvent(new Event('change'));syncChoices()};$(parent).append(b)}hues.forEach((h,i)=>choice(color,'colors',h,namesSkin[i],true));patternsSkin.forEach((n,i)=>choice(pattern,'patterns',i,n,false));function syncChoices(){for(let [id,el] of [['colors',color],['patterns',pattern]])for(let b of $(id).children)b.setAttribute('aria-pressed',String(b.dataset.value===el.value));for(let m of ['keyboard','mouse'])$(m+'Mode').setAttribute('aria-pressed',String(inputMode.value===m));$('controlHint').textContent=inputMode.value==='mouse'?'Mouse: mover • clique: bolhas • Esc: pausa':'A/D ou setas • Espaço: bolhas • P: pausa'}for(let m of ['keyboard','mouse'])$(m+'Mode').onclick=()=>{inputMode.value=m;inputMode.dispatchEvent(new Event('change'));syncChoices()};function syncOverlay(){let show=!active()||paused;$('overlay').hidden=!show;setup.hidden=active();$('heading').textContent=paused&&active()?'PAUSADO':mode==='lost'?'FIM DE JOGO':'PEIXITO JUMP';$('message').textContent=paused&&active()?'Continue quando estiver pronto.':mode==='lost'?reason+' Pontos: '+score:'Pule pelos corais, dispare bolhas e alcance novas alturas!';$('start').textContent=paused&&active()?'▶ CONTINUAR':mode==='lost'?'↻ JOGAR NOVAMENTE':'▶ COMEÇAR A JOGAR'}function resume(){clearInput();if(inputMode.value==='mouse'&&!lockUnavailable){lockMouse()}else paused=false}function pauseGame(){if(!active())return;if(paused){resume();return}paused=true;clearInput();if(document.pointerLockElement===c)document.exitPointerLock()}let mouseX=null,mouseHeld=false,clickShot=false,paused=false,lockPending=false,lockUnavailable=false;const hint=document.querySelector("#lockHint");function active(){return mode==="play"||mode==="boss"}function clearInput(){keys.clear();touch=0;fireHeld=false;mouseHeld=false;clickShot=false;mouseX=fish?fish.x:null}function lockMouse(){if(inputMode.value!=="mouse"||!active()||document.pointerLockElement===c||lockPending)return;lockPending=true;try{if(!c.requestPointerLock)throw Error();let p=c.requestPointerLock();if(p&&p.catch)p.catch(lockFailed)}catch{lockFailed()}}function lockFailed(){lockPending=false;lockUnavailable=true;if(!active())return;paused=false;hint.textContent="Captura indisponível: mouse livre; reinicie para tentar novamente."}document.addEventListener("pointerlockerror",lockFailed);document.addEventListener("pointerlockchange",()=>{lockPending=false;let locked=document.pointerLockElement===c;if(locked)lockUnavailable=false;c.classList.toggle("locked",locked);clearInput();if(!active())return;paused=inputMode.value==="mouse"&&!locked;hint.textContent=locked?"Mouse capturado • Esc para pausar e liberar":"Pausado • clique no jogo para continuar"});try{let pref=JSON.parse(localStorage.peixitoJumpPrefs||'{}');for(let el of [color,pattern,inputMode])if([...el.options].some(o=>o.value===pref[el.id]))el.value=pref[el.id]}catch{}for(let el of [color,pattern,inputMode])el.addEventListener('change',()=>{try{localStorage.peixitoJumpPrefs=JSON.stringify({color:color.value,pattern:pattern.value,inputMode:inputMode.value})}catch{}});syncChoices();function direction(){if(touch)return touch;if(inputMode.value==='mouse'){if(mouseX===null)return 0;return clamp((mouseX-fish.x)/24,-1,1)}return (keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0)}function drawFish(ctx,x,y,scale,face,t){let h=+color.value,p=+pattern.value;ctx.save();ctx.translate(x,y);ctx.scale(scale*face,scale);ctx.fillStyle=`hsl(${h},78%,46%)`;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-23+Math.sin(t/85)*4,-12);ctx.lineTo(-23+Math.sin(t/85)*4,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.ellipse(0,0,18,13,0,0,7);let grad=ctx.createLinearGradient(0,-13,0,13);grad.addColorStop(0,`hsl(${h},90%,76%)`);grad.addColorStop(1,`hsl(${h},80%,44%)`);ctx.fillStyle=grad;ctx.fill();ctx.save();ctx.clip();if(p===1){ctx.strokeStyle=`hsl(${h},70%,30%)`;ctx.lineWidth=4;for(let i=-13;i<5;i+=7){ctx.beginPath();ctx.moveTo(i,-15);ctx.quadraticCurveTo(i+7,0,i,15);ctx.stroke()}}if(p===2){ctx.fillStyle='#ffffff99';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(-14+i%4*6,-7+Math.floor(i/4)*12,2,0,7);ctx.fill()}}if(p===3){ctx.fillStyle='#ffffff99';ctx.fillRect(-20,3,40,14)}if(p===4){ctx.fillStyle=`hsl(${(h+70)%360},85%,55%)`;ctx.beginPath();ctx.ellipse(-13,0,12,15,0,0,7);ctx.fill()}ctx.restore();ctx.fillStyle=`hsl(${h},75%,42%)`;ctx.beginPath();ctx.ellipse(-5,5,7,3,Math.sin(t/85)*.3,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(9,-4,6,0,7);ctx.fill();ctx.fillStyle='#12334d';ctx.beginPath();ctx.arc(11,-4,3,0,7);ctx.fill();ctx.restore()}function wantsFire(){return keys.has(' ')||fireHeld||mouseHeld||clickShot}function trackMouse(e){let r=c.get 0,w:110,type:'normal'}];highest=H-60;while(highest>-150)addPlatform();hud()}function start(){reset();clearInput();paused=false;lockUnavailable=false;setup.hidden=true;mode='play';hint.textContent=inputMode.value==='mouse'?'Clique no jogo para capturar o mouse • Esc para liberar':'';if(inputMode.value==='mouse'){paused=true;lockMouse()}tone(440)}function burst(x,y,col){for(let i=0;i<12;i++)particles.push({x,y,vx:rand(-2,2),vy:rand(-2,1),life:rand(18,35),col})}function step(t){if(paused)return;if(inv>0)inv--;if(mode==='boss'){bossStep();return}if(mode!=='play')return;let d=direction();fish.vx+=(d*5.2-fish.vx)*.19;if(Math.abs(d)>.05)fish.face=Math.sign(d);if(inputMode.value==='mouse'){fish.x=clamp(fish.x+fish.vx,22,W-22);if(fish.x===22||fish.x===W-22)fish.vx=0}else fish.x=(fish.x+fish.vx+W)%W;let old=fish.y;fish.vy+=.32;fish.y+=fish.vy;combat(old);if(mode!=='play')return;for(let p of plats){if(p.type==='moving')p.x=clamp(p.base+Math.sin(t/950+p.phase)*38,5,W-p.w-5);if(fish.vy>0&&old+12<=p.y&&fish.y+12>=p.y&&fish.x+14>p.x&&fish.x-14<p.x+p.w){if(p.type==='spike'){hit('Coral espinhoso!');if(mode==='lost')return}fish.y=p.y-12;fish.vy=p.type==='boost'?-15:-10.8;burst(fish.x,p.y,p.type==='boost'?'#fff1a0':'#b8faff');tone(p.type==='boost'?790:420);break}}for(let p of plats){if(p.shield&&Math.hypot(fish.x-p.x-p.w/2,fish.y-p.y+30)<29){p.shield=false;shield=true;burst(fish.x,fish.y,'#baffff');tone(990);hud()}}camera=Math.min(camera,fish.y-H*.60);altitude=Math.max(altitude,Math.floor((H-90-fish.y)/10));let s=altitude+bonus;if(s!==score){score=s;if(score>best){best=score;try{localStorage.peixitoJumpBest=best}catch{}}hud()}if(altitude>=nextBoss){beginBoss();return}while(highest>camera-150)addPlatform();plats=plats.filter(p=>p.y<camera+H+100);particles=particles.filter(p=>--p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy}if(fish.y>camera+H+45){lose('Você caiu!')}}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function rect(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function draw(t){let bg=g.createLinearGradient(0,0,0,H);let n=Math.floor(altitude/1000)%6,f=(altitude%1000)/1000;bg.addColorStop(0,mix(pal[n][0],pal[(n+1)%6][0],f));bg.addColorStop(1,mix(pal[n][1],pal[(n+1)%6][1],f));g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<24;i++){let x=(i*97+Math.sin(t/1500+i)*12+W)%W,y=((i*83-t*.018-camera*.18)%H+H)%H,r=3+i%7;g.strokeStyle='#b4f6ff30';g.lineWidth=1;g.beginPath();g.arc(x,y,r,0,7);g.stroke()}g.fillStyle='#ffffffbb';g.font='16px system-ui';g.textAlign='left';g.fillText(biomes[Math.floor(altitude/1000)%6],18,28);for(let p of plats){let y=p.y-camera;if(y<-30||y>H+20)continue;if(p.type==='spike'){for(let j=0;j<5;j++){g.fillStyle='#ff747e';g.beginPath();g.moveTo(p.x+j*8,y+12);g.lineTo(p.x+j*8+4,y-7);g.lineTo(p.x+j*8+8,y+12);g.fill()}continue}let col=p.type==='boost'?'#f5cf70':p.type==='moving'?'#a99aff':'#ef8cc8';rect(p.x,y,p.w,14,7,col);rect(p.x+4,y+2,p.w-8,4,2,'#ffffff65');for(let j=0;j<3;j++)circle(p.x+12+j*(p.w-24)/2,y+10,4,col);if(p.shield){circle(p.x+p.w/2,y-30,13,'#a4f5ff66');g.strokeStyle='#e0ffff';g.lineWidth=2;g.stroke();g.fillStyle='white';g.font='16px system-ui';g.textAlign='center';g.fillText('+',p.x+p.w/2,y-24)}if(p.type==='boost'){circle(p.x+p.w/2,y-10,10,'#a4f5ff77');g.strokeStyle='#d9ffff';g.stroke();circle(p.x+p.w/2-3,y-13,3,'white')}}for(let p of particles){g.globalAlpha=Math.min(1,p.life/15);circle(p.x,p.y-camera,3,p.col)}g.globalAlpha=1;drawEnemies(t);if(boss)drawBoss(t);if(shield){circle(fish.x,fish.y-camera,25,'#a4f5ff33');g.strokeStyle='#aaffff';g.lineWidth=2;g.stroke()}g.save();if(inv>0&&Math.floor(inv/5)%2)g.globalAlpha=.4;drawFish(g,fish.x,fish.y-camera,1,fish.face,t);g.restore();if(paused&&active()){rect(W/2-170,H/2-70,340,140,20,'#082e4dee');g.textAlign='center';g.fillStyle='white';g.font='bold 30px system-ui';g.fillText('Pausado',W/2,H/2-12);g.font='17px system-ui';g.fillText('Clique no jogo para continuar',W/2,H/2+25)}}function lose(r){mode='lost';paused=false;hint.textContent='';if(document.pointerLockElement===c)document.exitPointerLock();reason=r;setup.hidden=false;mouseHeld=false;clickShot=false;tone(130)}
function combat(old){if(cool>0)cool--;if(wantsFire()&&!cool){shots.push({x:fish.x,y:fish.y-18,life:150});clickShot=false;cool=15;tone(650)}
while(spawnAt>camera-180){let type=['shark','octopus','jelly'][Math.floor(Math.random()*3)];enemies.push({x:rand(45,W-45),y:spawnAt,base:spawnAt,vx:rand(1,2.2)*(Math.random()<.5?-1:1),phase:rand(0,6.28),age:0,type,hp:type==='shark'?2:1});spawnAt-=rand(210,340)}
for(let e of enemies){e.age++;e.x+=e.vx;if(e.x<28||e.x>W-28){e.x=clamp(e.x,28,W-28);e.vx*=-1}e.y=e.base+Math.sin(e.age*(e.type==='shark'?.025:.035)+e.phase)*(e.type==='shark'?65:22);if(e.type==='octopus'&&e.age%115===0&&e.y>camera-20&&e.y<camera+H){ink.push({x:e.x,y:e.y+15,vy:2.5,life:240})}}
for(let b of shots){b.y-=10;b.life--;for(let e of enemies){if(e.hp>0&&b.life>0&&Math.hypot(b.x-e.x,b.y-e.y)<25){b.life=0;e.hp--;burst(b.x,b.y,'#a9faff');if(!e.hp){bonus+=25;tone(880)}}}}
shots=shots.filter(b=>b.life>0&&b.y>camera-100);enemies=enemies.filter(e=>e.hp>0&&e.y<camera+H+100);for(let e of enemies){let top=e.y-(e.type==='shark'?20:19);if(fish.vy>0&&old+12<=top+4&&fish.y+12>=top&&Math.abs(fish.x-e.x)<(e.type==='shark'?30:23)){e.hp=0;fish.y=top-12;fish.vy=-15.5;bonus+=40;burst(e.x,top,'#fff1a0');burst(fish.x,fish.y,'#b8faff');tone(920);continue}if(Math.hypot(fish.x-e.x,fish.y-e.y)<(e.type==='shark'?30:24)){hit(e.type==='shark'?'Tubarão!':e.type==='octopus'?'Polvo!':'Água-viva!');if(mode==='lost')return}}
enemies=enemies.filter(e=>e.hp>0);for(let b of ink){b.y+=b.vy;b.life--;if(Math.hypot(fish.x-b.x,fish.y-b.y)<20){b.life=0;hit('Tinta do polvo!');if(mode==='lost')return}}ink=ink.filter(b=>b.life>0&&b.y<camera+H+30)}
function drawEnemies(t){for(let b of shots){circle(b.x,b.y-camera,8,'#8deaff88');g.strokeStyle='#c9ffff';g.lineWidth=2;g.stroke();circle(b.x-2,b.y-camera-3,2,'white')}for(let b of ink){circle(b.x,b.y-camera,8,'#b68aff');circle(b.x-2,b.y-camera-3,2,'#e7caff')}for(let e of enemies){g.save();g.translate(e.x,e.y-camera);if(e.type==='shark'){g.scale(Math.sign(e.vx),1);g.fillStyle='#8bb8cf';g.beginPath();g.moveTo(-17,0);g.lineTo(-34,-13+Math.sin(t/90)*4);g.lineTo(-34,13);g.fill();g.beginPath();g.ellipse(0,0,27,14,0,0,7);g.fill();g.beginPath();g.moveTo(-8,-10);g.lineTo(0,-26);g.lineTo(10,-10);g.fill();circle(15,-5,5,'white');circle(17,-5,2,'#12334d');}else{let col=e.type==='octopus'?'#bd87ef':'#75e5d8';g.strokeStyle=col;g.lineWidth=5;g.lineCap='round';for(let i=0;i<5;i++){g.beginPath();g.moveTo(-14+i*7,7);g.quadraticCurveTo(-14+i*7+Math.sin(t/130+i)*9,20,-14+i*7+Math.cos(t/150+i)*7,27);g.stroke()}circle(0,-3,19,col);circle(-6,-5,4,'white');circle(6,-5,4,'white');circle(-5,-4,2,'#12334d');circle(7,-4,2,'#12334d')}g.restore()}}

const pal=[['#197f9e','#092e4d'],['#267f91','#633d78'],['#299b80','#104b48'],['#58cce0','#2467a2'],['#e7b77a','#318fb3'],['#6668b5','#24264e']],biomes=['Oceano profundo','Recifes de coral','Floresta de algas','Águas cristalinas','Superfície','Céu encantado'],names=['Polvo gigante','Caranguejo gigante','Tubarão gigante','Água-viva gigante','Peixe-balão gigante','Dragão aquático'];
function mix(a,b,f){return '#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-f)+parseInt(b.slice(i,i+2),16)*f).toString(16).padStart(2,'0')).join('')}
function hit(r){if(inv)return;if(shield){shield=false;inv=100;burst(fish.x,fish.y,'#baffff');tone(260);hud()}else lose(r)}
function beginBoss(){mode='boss';plats=[];enemies=[];shots=[];ink=[];particles=[];fish.y=camera+H-70;fish.vy=0;fish.vx=0;let hp=18+bossCount*5;boss={x:W/2,y:camera+150,hp,max:hp,age:0,type:bossCount%6};tone(180)}
function bossStep(){let d=direction();fish.vx+=(d*6-fish.vx)*.22;fish.x=clamp(fish.x+fish.vx,22,W-22);if(Math.abs(d)>.05)fish.face=Math.sign(d);boss.age++;boss.x=W/2+Math.sin(boss.age*.018)*210;if(cool>0)cool--;if(wantsFire()&&!cool){shots.push({x:fish.x,y:fish.y-18,life:150});clickShot=false;cool=12;tone(650)}if(boss.age>90&&boss.age%Math.max(30,65-bossCount*4)===0){let pattern=Math.floor(boss.age/180)%3;for(let i=-1;i<=1;i++){let vx=pattern===0?i*1.6:pattern===1?(fish.x-boss.x)/150+i*.8:i*2.5;ink.push({x:boss.x,y:boss.y+45,vx,vy:3.5+Math.min(2,bossCount*.2),life:300})}}for(let b of shots){b.y-=12;b.life--;if(b.life>0&&Math.hypot(b.x-boss.x,b.y-boss.y)<58){b.life=0;boss.hp--;burst(b.x,b.y,'#baffff');tone(780)}}shots=shots.filter(b=>b.life>0&&b.y>camera-30);for(let b of ink){b.x+=b.vx;b.y+=b.vy;b.life--;if(Math.hypot(fish.x-b.x,fish.y-b.y)<22){b.life=0;hit('Disparo do chefão!');if(mode==='lost')return}}ink=ink.filter(b=>b.life>0&&b.y<camera+H+30);particles=particles.filter(p=>--p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy}if(boss.hp<=0){bonus+=250;score=altitude+bonus;if(score>best){best=score;try{localStorage.peixitoJumpBest=best}catch{}}bossCount++;nextBoss+=1000;boss=null;shots=[];ink=[];fish.vy=-10.8;fish.y=H-90-altitude*10;camera=fish.y-H*.6;plats=[{x:clamp(fish.x-55,0,W-110),y:fish.y+25,w:110,type:'normal'}];highest=plats[0].y;while(highest>camera-150)addPlatform();spawnAt=highest-150;inv=100;mode='play';hud();tone(1100)}}
function drawBoss(t){let y=boss.y-camera;g.save();g.translate(boss.x,y);let col=['#bd87ef','#ff927c','#8bb8cf','#75e5d8','#f5cf70','#a99aff'][boss.type];g.strokeStyle=col;g.lineWidth=12;g.lineCap='round';for(let i=0;i<7;i++){g.beginPath();g.moveTo(-42+i*14,15);g.quadraticCurveTo(-42+i*14+Math.sin(t/130+i)*20,45,-42+i*14+Math.cos(t/150+i)*12,66);g.stroke()}circle(0,0,53,col);circle(-18,-9,13,'white');circle(18,-9,13,'white');circle(-15,-6,6,'#12334d');circle(21,-6,6,'#12334d');g.restore();rect(75,48,450,18,9,'#092e4d');rect(75,48,450*Math.max(0,boss.hp/boss.max),18,9,'#ff9bb9');g.fillStyle='white';g.textAlign='center';g.font='bold 18px system-ui';g.fillText(names[boss.type]+' • '+Math.max(0,boss.hp)+' / '+boss.max,W/2,90);if(boss.age<90)g.fillText('CHEFÃO! Desvie e dispare bolhas!',W/2,H/2)}

function loop(t){acc+=Math.min(50,t-last||16);last=t;while(acc>=1000/60){step(t);acc-=1000/60}draw(t);syncOverlay();if(!setup.hidden){pg.clearRect(0,0,320,100);drawFish(pg,160,50,2.7,1,t)}requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{if(e.target.matches('select,button,input'))return;let k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' '].includes(k))e.preventDefault();if(k===' '&&!active()&&!e.repeat)start();keys.add(e.key.startsWith('Arrow')?e.key:k)});window.addEventListener('keyup',e=>keys.delete(e.key.startsWith('Arrow')?e.key:e.key.toLowerCase()));window.addEventListener('blur',()=>{clearInput();if(active()&&inputMode.value==='mouse'){paused=true;hint.textContent='Pausado • clique no jogo para continuar';if(document.pointerLockElement===c)document.exitPointerLock()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active()&&inputMode.value==='mouse'){paused=true;clearInput();if(document.pointerLockElement===c)document.exitPointerLock()}});for(let b of document.querySelectorAll('[data-dir]')){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);touch=+b.dataset.dir};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>touch=0}const fb=document.querySelector('#fire');fb.onpointerdown=e=>{fb.setPointerCapture(e.pointerId);if(mode!=='play'&&mode!=='boss')start();fireHeld=true};fb.onpointerup=fb.onpointercancel=fb.onlostpointercapture=()=>fireHeld=false;$('start').onclick=()=>{if(active()&&paused)resume();else start()};$('pause').onclick=pauseGame;window.addEventListener('keydown',e=>{if(!e.repeat&&e.key.toLowerCase()==='p'&&active())pauseGame()});document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent='Som: '+(sound?'ligado':'desligado')};reset();requestAnimationFrame(loop);
</script></body></html>
