'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),W=600,H=900;let boss,shield,inv,nextBoss,altitude,bossCount;let enemies,shots,ink,cool,bonus,reason,spawnAt,fireHeld=false;let fish,plats,particles,camera,highest,score,mode='menu',best=0,keys=new Set(),touch=0,sound=true,audio,last=0,acc=0;try{best=+localStorage.peixitoJumpBest||0}catch{}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const setup=document.querySelector('#setup'),preview=document.querySelector('#preview'),pg=preview.getContext('2d'),color=document.querySelector('#color'),pattern=document.querySelector('#pattern'),inputMode=document.querySelector('#inputMode');let mouseX=null,mouseHeld=false,clickShot=false;try{let pref=JSON.parse(localStorage.peixitoJumpPrefs||'{}');for(let el of [color,pattern,inputMode])if([...el.options].some(o=>o.value===pref[el.id]))el.value=pref[el.id]}catch{}for(let el of [color,pattern,inputMode])el.addEventListener('change',()=>{try{localStorage.peixitoJumpPrefs=JSON.stringify({color:color.value,pattern:pattern.value,inputMode:inputMode.value})}catch{}});function direction(){if(touch)return touch;if(inputMode.value==='mouse'){if(mouseX===null)return 0;return clamp((mouseX-fish.x)/24,-1,1)}return (keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0)}function drawFish(ctx,x,y,scale,face,t){let h=+color.value,p=+pattern.value;ctx.save();ctx.translate(x,y);ctx.scale(scale*face,scale);ctx.fillStyle=`hsl(${h},78%,46%)`;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-23+Math.sin(t/85)*4,-12);ctx.lineTo(-23+Math.sin(t/85)*4,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.ellipse(0,0,18,13,0,0,7);let grad=ctx.createLinearGradient(0,-13,0,13);grad.addColorStop(0,`hsl(${h},90%,76%)`);grad.addColorStop(1,`hsl(${h},80%,44%)`);ctx.fillStyle=grad;ctx.fill();ctx.save();ctx.clip();if(p===1){ctx.strokeStyle=`hsl(${h},70%,30%)`;ctx.lineWidth=4;for(let i=-13;i<5;i+=7){ctx.beginPath();ctx.moveTo(i,-15);ctx for(let e of enemies){e.age++;e.x+=e.vx;if(e.x<28||e.x>W-28){e.x=clamp(e.x,28,W-28);e.vx*=-1}e.y=e.base+Math.sin(e.age*(e.type==='shark'?.025:.035)+e.phase)*(e.type==='shark'?65:22);if(e.type==='octopus'&&e.age%115===0&&e.y>camera-20&&e.y<camera+H){ink.push({x:e.x,y:e.y+15,vy:2.5,life:240})}}

function bossStep(){let d=direction();fish.vx+=(d*6-fish.vx)*.22;fish.x=clamp(fish.x+fish.vx,22,W-22);if(Math.abs(d)>.05)fish.face=Math.sign(d);boss.age++;boss.x=W/2+Math.sin(boss.age*.018)*210;if(cool>0)cool--;if(wantsFire()&&!cool){shots.push({x:fish.x,y:fish.y-18,life:150});clickShot=false;cool=12;tone(650)}if(boss.age>90&&boss.age%Math.max(30,65-bossCount*4)===0){let pattern=Math.floor(boss.age/180)%3;for(let i=-1;i<=1;i++){let vx=pattern===0?i*1.6:pattern===1?(fish.x-boss.x)/150+i*.8:i*2.5;ink.push({x:boss.x,y:boss.y+45,vx,vy:3.5+Math.min(2,bossCount*.2),life:300})}}for(let b of shots){b.y-=12;b.life--;if(b.life>0&&Math.hypot(b.x-boss.x,b.y-boss.y)<58){b.life=0;boss.hp--;burst(b.x,b.y,'#baffff');tone(780)}}shots=shots.filter(b=>b.life>0&&b.y>camera-30);for(let b of ink){b.x+=b.vx;b.y+=b.vy;b.life--;if(Math.hypot(fish.x-b.x,fish.y-b.y)<22){b.life=0;hit('Disparo do chefão!');if(mode==='lost')return}}ink=ink.filter(b=>b.life>0&&b.y<camera+H+30);particles=particles.filter(p=>--p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy}if(boss.hp<=0){bonus+=250;score=altitude+bonus;if(score>best){best=score;try{localStorage.peixitoJumpBest=best}catch{}}bossCount++;nextBoss+=1000;boss=null;shots=[];ink=[];fish.vy=-10.8;fish.y=H-90-altitude*10;camera=fish.y-H*.6;plats=[{x:clamp(fish.x-55,0,W-110),y:fish.y+25,w:110,type:'normal'}];highest=plats[0].y;while(highest>camera-150)addPlatform();spawnAt=highest-150;inv=100;mode='play';hud();tone(1100)}}
function drawBoss(t){let y=boss.y-camera;g.save();g.translate(boss.x,y);let col=['#bd87ef','#ff927c','#8bb8cf','#75e5d8','#f5cf70','#a99aff'][boss.type];g.strokeStyle=col;g.lineWidth=12;g.lineCap='round';for(let i=0;i<7;i++){g.beginPath();g.moveTo(-42+i*14,15);g.quadraticCurveTo(-42+i*14+Math.sin(t/130+i)*20,45,-42+i*14+Math.cos(t/150+i)*12,66);g.stroke()}circle(0,0,53,col);circle(-18,-9,13,'white');circle(18,-9,13,'white');circle(-15,-6,6,'#12334d');circle(21,-6,6,'#12334d');g.restore();rect(75,48,450,18,9,'#092e4d');rect(75,48,450*Math.max(0,boss.hp/boss.max),18,9,'#ff9bb9');g.fillStyle='white';g.textAlign='center';g.font='bold 18px system-ui';g.fillText(names[boss.type]+' • '+Math.max(0,boss.hp)+' / '+boss.max,W/2,90);if(boss.age<90)g.fillText('CHEFÃO! Desvie e dispare bolhas!',W/2,H/2)}

function loop(t){acc+=Math.min(50,t-last||16);last=t;while(acc>=1000/60){step(t);acc-=1000/60}draw(t);if(!setup.hidden){pg.clearRect(0,0,150,90);drawFish(pg,80,45,2.2,1,t)}requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{if(e.target.matches('select,button,input'))return;let k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' '].includes(k))e.preventDefault();if(k===' '&&mode!=='play'&&mode!=='boss'&&!e.repeat)start();keys.add(e.key.startsWith('Arrow')?e.key:k)});window.addEventListener('keyup',e=>keys.delete(e.key.startsWith('Arrow')?e.key:e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();touch=0;fireHeld=false;mouseHeld=false;clickShot=false;mouseX=null});for(let b of document.querySelectorAll('[data-dir]')){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);touch=+b.dataset.dir};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>touch=0}const fb=document.querySelector('#fire');fb.onpointerdown=e=>{fb.setPointerCapture(e.pointerId);if(mode!=='play'&&mode!=='boss')start();fireHeld=true};fb.onpointerup=fb.onpointercancel=fb.onlostpointercapture=()=>fireHeld=false;document.querySelector('#start').onclick=start;document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent='Som: '+(sound?'ligado':'desligado')};reset();requestAnimationFrame(loop);
</script></body></html>
